        reserveType:
          $ref: '#/components/schemas/ReserveType'
        direction:
          $ref: '#/components/schemas/Direction'
        procurement:
          description: The procurement these volumes came from.
          allOf:
            - $ref: '#/components/schemas/Procurement'
        volumes:
          type: array
