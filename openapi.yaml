  /balancing/capacity/procured-volumes:
    get:
      summary: Get procured balancing capacity volumes
      description: Returns procured balancing capacity volumes for the specified area and reserve type within the given time period. Volumes are expressed in MW. Supports cursor-based pagination for large result sets.
      operationId: getBalancingCapacityProcuredVolumes
