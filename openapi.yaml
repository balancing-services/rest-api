  /balancing/capacity/demand:
    get:
      summary: Get balancing capacity demand
      description: |
        **EXPERIMENTAL**: Returns balancing capacity demand for the specified area and reserve type within
        the given time period, i.e. the balancing capacity the TSO set out to procure. Demand is expressed
        in MW and grouped per procurement (`procurement.procuredAt`), so it can be compared against the
        procured volumes of the same procurement.

        Each group carries a `demandBasis`: `additive` demand adds to the delivery period's total
        requirement, while `substitutive` demand restates demand already represented by another procurement
        of the same period (e.g. a re-run after a failed auction). When summing a period's total requirement
        across procurements, sum additive demand only.

        Total demand is the full requirement; local demand is the part that must be procured within the
        area itself, so total minus local may be covered from other areas.
        Supports cursor-based pagination for large result sets.

        This endpoint is experimental and may be changed or removed without a deprecation period.
      operationId: getBalancingCapacityDemand
      x-experimental: true
      parameters:
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/reserve-type'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
