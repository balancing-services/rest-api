  /balancing/cross-border/available-capacity:
    get:
      summary: Get cross-border available capacity
      description: |
        Returns the available capacity for balancing energy exchange across the border
        between two areas, for the specified reserve type and time period. Both border ends must be given
        (`area` and `other-area`); results cover both directions (area → other-area and other-area → area).
        The value is the per-direction capacity available for balancing energy exchange.
        Capacities are expressed in MW.

        Results are cursor-paginated: pass `limit` (1–1000, defaults to 100) and follow `nextCursor` from each
        response until `hasMore` is false.
      operationId: getCrossBorderAvailableCapacity
      parameters:
        - name: area
          in: query
          description: One end of the border (matched as either the from or the to area)
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'ES'
        - name: other-area
          in: query
          description: The other end of the border (matched as either the from or the to area)
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'PT'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/reserve-type'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossBorderAvailableCapacityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
