  /balancing/energy/prices:
    get:
      summary: Get balancing energy prices
      description: Returns balancing energy prices for the specified area and reserve type within the given time period. Prices are in the specified currency per MWh. Supports cursor-based pagination for large result sets.
      operationId: getBalancingEnergyPrices
      parameters:
