          nullable: true
        hasMore:
          type: boolean
          description: Indicates whether there are more results available
          example: false
        nextUpdatedSince:
          $ref: '#/components/schemas/NextUpdatedSince'

    BalancingCapacityDemands:
      type: object
      required:
