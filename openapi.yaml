  /balancing/energy/cross-border-volumes:
    get:
      summary: Get cross-border balancing energy volumes
      description: |
        Returns cross-border balancing energy volumes across the border between two areas,
        for the specified reserve type and time period. Both border ends must be given (`area` and `other-area`);
        results cover both directions (area → other-area and other-area → area). Volumes are expressed as average power in MW
        and split by activation type — for mFRR, direct and scheduled activations are returned as separate entries,
        and volumes without a direct/scheduled breakdown come back as a single unspecified entry.
        Supports cursor-based pagination for large result sets.
      operationId: getCrossBorderEnergyVolumes
      parameters:
        - name: area
          in: query
          description: One end of the border (matched as either the from or the to area)
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'FI'
        - name: other-area
          in: query
          description: The other end of the border (matched as either the from or the to area)
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'EE'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/reserve-type'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossBorderEnergyVolumesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /energy/day-ahead/prices:
    get:
      summary: Get day-ahead energy prices
      description: |
        **EXPERIMENTAL**: Returns day-ahead wholesale electricity prices for the specified bidding zone
        within the given time period. Prices are returned in the bidding zone's native currency per MWh,
        as published by the relevant power exchange. Supports cursor-based pagination for large result
        sets.

        Coverage is limited to bidding zones whose day-ahead prices are published under CC BY 4.0
        or an equivalently permissive license that allows redistribution.

        This endpoint is experimental and may be changed or removed without a deprecation period.
      operationId: getDayAheadEnergyPrices
      x-experimental: true
      parameters:
        - name: area
          in: query
          description: The bidding zone for which to retrieve day-ahead prices
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'FI'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayAheadEnergyPricesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  parameters:
    area:
      name: area
      in: query
      description: The area for which to retrieve data
      required: true
      schema:
        $ref: '#/components/schemas/Area'
      example: 'EE'
    period-start-at:
      name: period-start-at
      in: query
      description: Start of the time period (UTC)
      required: true
      schema:
        type: string
        format: date-time
        example: '2025-01-01T00:00:00Z'
    period-end-at:
      name: period-end-at
      in: query
      description: End of the time period (UTC)
      required: true
      schema:
        type: string
        format: date-time
        example: '2025-01-02T00:00:00Z'
    reserve-type:
      name: reserve-type
      in: query
      description: Filter by reserve type
      required: true
      schema:
        $ref: '#/components/schemas/ReserveType'
      example: 'aFRR'
    cursor:
      name: cursor
      in: query
      description: Pagination cursor from previous response. Omit to start from the beginning.
      required: false
      schema:
        type: string
        example: 'v1:AAAAAYwBAgMEBQYHCAkKCw=='
    updated-since:
      name: updated-since
      in: query
      description: >-
        Only return records the backend stored a change for strictly after this timestamp (UTC).
        Combine with the mandatory period window to poll incrementally for changes instead of
        re-downloading the full window. Pass back the `nextUpdatedSince` of your previous poll over
        the same window — a timestamp you derive yourself can silently skip changes.
        Like all query parameters, repeat the same value on every page of a paginated drain.
      required: false
      schema:
        type: string
        format: date-time
        example: '2025-01-02T09:15:00Z'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid-parameter:
              $ref: '#/components/examples/problem-invalid-parameter'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              $ref: '#/components/examples/problem-unauthorized'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              $ref: '#/components/examples/problem-forbidden'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              $ref: '#/components/examples/problem-not-found'
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            example: 12
        X-RateLimit-Limit:
          description: Maximum number of requests allowed per minute
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate-limited:
              $ref: '#/components/examples/problem-rate-limited'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal-error:
              $ref: '#/components/examples/problem-internal-error'
    NotImplemented:
      description: Not implemented
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-implemented:
              $ref: '#/components/examples/problem-not-implemented'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Enter your API token

  examples:
    problem-missing-parameter:
      summary: Missing required parameter
      value:
        type: missing-parameter
        title: Missing Parameter
        status: 400
        detail: Required parameter 'area' is missing
    problem-invalid-parameter:
      summary: Invalid parameter value
      value:
        type: invalid-parameter
        title: Invalid Parameter
        status: 400
        detail: The area parameter value is not valid
    problem-unauthorized:
      summary: Missing or invalid authentication
      value:
        type: unauthorized
        title: Unauthorized
        status: 401
        detail: Valid API token required
    problem-forbidden:
      summary: Insufficient permissions
      value:
        type: forbidden
        title: Forbidden
        status: 403
        detail: Access to this resource is not allowed
    problem-not-found:
      summary: Resource not found
      value:
        type: not-found
        title: Not Found
        status: 404
        detail: The requested resource was not found
    problem-not-implemented:
      summary: Feature not yet implemented
      value:
        type: not-implemented
        title: Not Implemented
        status: 501
        detail: This feature is not yet available
    problem-rate-limited:
      summary: Too many requests
      value:
        type: rate-limited
        title: Rate Limited
        status: 429
        detail: Request limit exceeded. Please try again later
    problem-internal-error:
      summary: Server error
      value:
        type: internal-error
        title: Internal Server Error
        status: 500
        detail: An unexpected error occurred while processing the request

  schemas:
    NextUpdatedSince:
      type: string
      format: date-time
      description: >-
        The watermark to pass as `updated-since` on the next poll. Every page of one drain reports
        the same value. It deliberately lags real time to cover writes that were still committing,
        so consecutive polls overlap slightly and a record may be delivered more than once — upsert
        on consume.
      example: '2025-01-02T09:15:00Z'
    ImbalancePricesResponse:
      type: object
      required:
        - queriedPeriod
        - data
        - hasMore
        - nextUpdatedSince
      properties:
        queriedPeriod:
          $ref: '#/components/schemas/Period'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImbalancePrices'
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results. Null if no more results.
          example: 'v1:AAAAAYwBAgMEBQYHCAkKCw=='
          nullable: true
        hasMore:
          type: boolean
          description: Indicates whether there are more results available
          example: true
        nextUpdatedSince:
          $ref: '#/components/schemas/NextUpdatedSince'

    ImbalancePrices:
      type: object
      required:
        - area
        - eicCode
        - currency
        - direction
        - prices
      properties:
        area:
          $ref: '#/components/schemas/Area'
        eicCode:
          $ref: '#/components/schemas/EicCode'
        currency:
          $ref: '#/components/schemas/Currency'
        direction:
          $ref: '#/components/schemas/ImbalanceDirection'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ImbalancePrice'

    ImbalancePrice:
      type: object
      required:
        - period
        - pricePerMwh
      properties:
        period:
          $ref: '#/components/schemas/Period'
        pricePerMwh:
          type: number
          description: Price per MWh in the specified currency
          example: 45.50

    ImbalanceTotalVolumesResponse:
      type: object
      required:
        - queriedPeriod
        - data
        - hasMore
        - nextUpdatedSince
      properties:
        queriedPeriod:
