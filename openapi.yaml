  /balancing/capacity/prices:
    get:
      summary: Get balancing capacity prices
      description: Returns balancing capacity prices for the specified area and reserve type within the given time period. Prices are in the specified currency per MW per hour. Supports cursor-based pagination for large result sets.
      operationId: getBalancingCapacityPrices
      parameters:
