openapi: 3.0.3
info:
  title: Balancing Services REST API
  version: 2.0.2
  description: REST API for balancing services data
  contact:
    name: Balancing Services Team

servers:
  - url: https://api.balancing.services/v2
    description: Production API server

security:
  - BearerAuth: []

paths:
  /imbalance/prices:
    get:
      summary: Get imbalance prices for an area
      description: Returns imbalance prices for the specified area within the given time period. Prices are in the specified currency per MWh. Supports cursor-based pagination for large result sets.
      operationId: getImbalancePrices
      parameters:
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImbalancePricesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /imbalance/total-volumes:
    get:
      summary: Get total imbalance volumes for an area
      description: Returns total aggregated imbalance volumes for the specified area within the given time period. Volumes are expressed as average power in MW. Supports cursor-based pagination for large result sets.
      operationId: getImbalanceTotalVolumes
      parameters:
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 100, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImbalanceTotalVolumesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /imbalance/total-volumes/current:
    get:
      summary: Get current (provisional) total imbalance volumes for an area
      description: |
        **Experimental** - This endpoint is under active development and may change without notice.

        Returns the current balancing state (ENTSO-E GL EB article 12.3.A): the open area control error at
        1-minute resolution, published roughly 25 minutes behind real time. This is the real-time preview of
        the total imbalance volume — values are provisional and are superseded by the settled volumes on
        /imbalance/total-volumes once those publish. Data is retained for roughly 90 days. Volumes are
        expressed as average power in MW. Supports cursor-based pagination for large result sets.
      operationId: getCurrentImbalanceTotalVolumes
      parameters:
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/period-start-at'
        - $ref: '#/components/parameters/period-end-at'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          description: Maximum number of results to return (default 120, max 1440)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 120
            example: 120
        - $ref: '#/components/parameters/updated-since'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImbalanceTotalVolumesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
