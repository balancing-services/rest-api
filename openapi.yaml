  /balancing/energy/cross-border-marginal-prices:
    get:
      summary: Get cross-border marginal prices
      description: |
        **Experimental** - This endpoint is under active development and may change without notice.

        Returns cross-border purchased marginal prices (CBPMs) for the specified area and reserve type within the given time period.
        Supports cursor-based pagination for large result sets.
      operationId: getCrossBorderMarginalPrices
      parameters:
        - name: area
          in: query
          description: The area for which to retrieve data
          required: true
          schema:
            $ref: '#/components/schemas/Area'
          example: 'AT'
        - name: period-start-at
