        procurement:
          $ref: '#/components/schemas/Procurement'
        demandBasis:
          $ref: '#/components/schemas/DemandBasis'
        demands:
          type: array
          items:
            $ref: '#/components/schemas/BalancingCapacityDemand'

    BalancingCapacityDemand:
      type: object
      required:
        - period
        - totalDemandInMw
        - localDemandInMw
      properties:
        period:
          $ref: '#/components/schemas/Period'
        totalDemandInMw:
          type: number
          description: The full capacity requirement in MW
          example: 300.0
        localDemandInMw:
          type: number
          description: The part of the requirement in MW that must be procured within the area itself; total minus local may be covered from other areas
          example: 120.0

    Period:
      type: object
      required:
        - startAt
        - endAt
      properties:
        startAt:
          type: string
          format: date-time
          description: Start of the period (UTC)
          example: '2025-01-01T00:00:00Z'
        endAt:
          type: string
          format: date-time
          description: End of the period (UTC)
          example: '2025-01-01T01:00:00Z'

    Area:
      type: string
      description: Area code
      enum:
        - AT
        - BALTICS
        - BE
        - BG
        - CH
        - CZ
        - DE
        - DE_50HERTZ
        - DE_AMPRION
        - DE_TENNET
        - DE_TRANSNETBW
        - DK1
        - DK2
        - EE
        - ES
        - FI
        - FR
        - GR
        - HR
        - HU
        - IT
        - IT_NORTH
        - IT_CENTER_NORTH
        - IT_CENTER_SOUTH
        - IT_SOUTH
        - IT_CALABRIA
        - IT_SICILY
        - IT_SARDINIA
        - LT
        - LV
        - NL
        - NO1
        - NO2
        - NO3
        - NO4
        - NO5
        - PL
        - PT
        - RO
        - RS
        - SE1
        - SE2
        - SE3
        - SE4
        - SI
        - SK
        - UA

    EicCode:
      type: string
      description: Energy Identification Code (EIC)
      # Append new codes at the END: the generated Python client names these enum
      # members positionally (VALUE_0, VALUE_1, ...), so inserting a code mid-list
      # rebinds VALUE_N for every later code. Resolved in REST API 2.0 by switching
      # the client to Literal enums (see clients/python/config.yaml).
      enum:
        - 10YAT-APG------L
        - 10YBE----------2
        - 10YCA-BULGARIA-R
        - 10YCH-SWISSGRIDZ
        - 10YCZ-CEPS-----N
        - 10Y1001A1001A83F
        - 10YDE-VE-------2
        - 10YDE-RWENET---I
        - 10YDE-EON------1
        - 10YDE-ENBW-----N
        - 10YDK-1--------W
        - 10YDK-2--------M
        - 10Y1001A1001A39I
        - 10YES-REE------0
        - 10YFI-1--------U
        - 10YFR-RTE------C
        - 10YGR-HTSO-----Y
        - 10YHR-HEP------M
        - 10YHU-MAVIR----U
        - 10YIT-GRTN-----B
        - 10Y1001A1001A73I
        - 10Y1001A1001A70O
        - 10Y1001A1001A71M
        - 10Y1001A1001A788
        - 10Y1001C--00096J
        - 10Y1001A1001A75E
        - 10Y1001A1001A74G
        - 10YLT-1001A0008Q
        - 10YLV-1001A00074
        - 10YNL----------L
        - 10YNO-1--------2
        - 10YNO-2--------T
        - 10YNO-3--------J
        - 10YNO-4--------9
        - 10Y1001A1001A48H
        - 10YPL-AREA-----S
        - 10YPT-REN------W
        - 10YRO-TEL------P
        - 10YCS-SERBIATSOV
        - 10Y1001A1001A44P
        - 10Y1001A1001A45N
        - 10Y1001A1001A46L
        - 10Y1001A1001A47J
        - 10YSI-ELES-----O
        - 10YSK-SEPS-----K
        - 10Y1001A1001A94A
        - 10Y1001C--000182

    ReserveType:
      type: string
      description: Reserve type
      enum:
        - FCR
        - aFRR
        - mFRR
        - RR

    Direction:
      type: string
      description: Balancing direction
      enum:
        - up
        - symmetric
        - down

    DemandBasis:
      type: string
      description: |
        Whether the demand adds to the delivery period's total requirement (`additive`) or restates demand
        already represented by another procurement of the same period (`substitutive`), e.g. a re-run after
        a failed auction. When summing a period's total requirement across procurements, sum additive demand only.
      enum:
        - additive
        - substitutive

    ImbalanceDirection:
      type: string
      description: Imbalance direction
      enum:
        - positive
        - symmetric
        - negative

    TotalImbalanceDirection:
      type: string
      description: |
        Total imbalance volume direction (ENTSO-E regulatory terminology):
        - surplus: Generation exceeds consumption (D > 0, positive imbalance)
        - deficit: Consumption exceeds generation (D < 0, negative imbalance)
        - balanced: Generation equals consumption (D = 0)
      enum:
        - surplus
        - deficit
        - balanced

    Currency:
      type: string
      description: Currency code
      enum:
        - BGN
        - CHF
        - EUR
        - HUF
        - PLN
        - RON
        - UAH

    ActivationType:
      type: string
      description: |
        Activation type of the balancing energy. Only mFRR distinguishes activation types:
        - direct: mFRR activated directly
        - scheduled: mFRR activated on a schedule
        - unspecified: mFRR without a direct/scheduled breakdown — the source does not publish one, or the product does not define one
        - notApplicable: the reserve type has no activation-type concept (FCR, aFRR, RR)
      enum:
        - direct
        - scheduled
        - unspecified
        - notApplicable

    BidStatus:
      type: string
      description: |
        Status of a capacity bid:
        - offered: Bid was offered but not accepted
        - accepted: Bid was accepted (at least partially accepted)
      enum:
        - offered
        - accepted

    Problem:
      type: object
      required:
        - type
        - status
        - title
      properties:
        type:
          type: string
          description: |
            Machine-readable slug identifying the problem type. Treat this as an open
            set: new types may be introduced without a major-version bump, so match the
            values you handle and fall back on `status` for anything you don't recognise.
            Currently defined:
            `missing-parameter`, `invalid-parameter`, `unauthorized`, `forbidden`,
            `not-found`, `rate-limited`, `not-implemented`, `internal-error`.
          example: not-found
        title:
          type: string
          description: Short, human-readable summary of the problem type
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence

