          $ref: '#/components/schemas/Period'
        bids:
          type: array
          description: >-
            The bids for this delivery period. No ordering is guaranteed — sort by price client-side if
            you need the merit order.
          items:
            $ref: '#/components/schemas/CapacityBid'

    CapacityBid:
      type: object
      required:
        - capacityInMw
        - pricePerMwPerHour
        - status
        - procurement
      properties:
        capacityInMw:
          type: number
          description: Bid capacity in MW
          example: 50
        pricePerMwPerHour:
          type: number
          description: Bid price per MW per hour in the specified currency
          example: 12.50
        status:
          $ref: '#/components/schemas/BidStatus'
        procurement:
          description: The procurement this bid was submitted to.
          allOf:
            - $ref: '#/components/schemas/Procurement'

    Procurement:
      type: object
      required:
        - procuredAt
      properties:
        procuredAt:
          type: string
          format: date-time
          description: |
            Timestamp when the capacity was procured (allocation time or gate closure time).
            Used to distinguish different procurements (e.g. yearly vs hourly, or multiple procurement rounds).
          example: "2024-08-15T14:30:00Z"

    BalancingCapacityPricesResponse:
      type: object
      required:
        - queriedPeriod
        - data
        - hasMore
        - nextUpdatedSince
      properties:
        queriedPeriod:
          $ref: '#/components/schemas/Period'
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalancingCapacityPrices'
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results. Null if no more results.
          example: 'v1:AAAAAYwBAgMEBQYHCAkKCw=='
          nullable: true
        hasMore:
          type: boolean
          description: Indicates whether there are more results available
          example: false
        nextUpdatedSince:
          $ref: '#/components/schemas/NextUpdatedSince'

    BalancingCapacityPrices:
      type: object
      required:
        - area
        - eicCode
        - reserveType
        - direction
        - currency
        - procurement
        - prices
      properties:
        area:
