project_name_override: "balancing-services"
package_name_override: "balancing_services"
python_version: "3.10"
use_union_operator: true
# Enum generation: we emit `Literal[...]` string types rather than Python `Enum`
# classes (`literal_enums: true` below). Each enum schema becomes a
# `Literal["10YIT-GRTN-----B", ...]` type alias plus a generated `<NAME>_VALUES`
# set and a `check_<name>` helper. Consumers pass and compare the bare string
# values directly (e.g. `area="EE"`); there are no enum members such as `Area.AT`
# or positional `EicCode.VALUE_19`, and model fields typed as these enums hold
# plain `str` (no `.value` accessor).
#
# Because a Literal has no member names bound to value order, adding or reordering
# enum values in openapi.yaml can never silently rebind a positional name — the
# old caveat about appending new EicCode values at the END no longer applies.
#
# This is a REST API 2.0 breaking change: it removes enum-member access.
literal_enums: true
# Format generated code at 88 columns (black's width) rather than letting
# `ruff format` pick up the project's line-length of 120. Keeps the generated
# client stable across regenerations regardless of the formatter's default.
# `--exit-zero` so leftover unfixable lint (e.g. docstring whitespace) in the
# generated code does not fail the generate step and abort generate.sh.
# Pin ruff (via `uvx ruff@<version>`) exactly as generate.sh pins the generator:
# a bare `ruff` resolves from PATH to whatever version happens to be cached,
# and newer ruff applies extra pyupgrade rewrites (e.g. `-> Self`, `*args:
# object`) that silently churn the generated client. Bump this deliberately.
post_hooks:
  - "uvx ruff@0.16.0 check --fix --exit-zero ."
  - "uvx ruff@0.16.0 format --line-length 88 ."
